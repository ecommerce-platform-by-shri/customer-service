server:
    port: 8081

spring:
  application:
    name: user-service

  datasource:
      url: jdbc:postgresql://localhost:5432/XApp
      username: postgres
      password: Pass@1234
      driver-class-name: org.postgresql.Driver

  jpa:
      hibernate:
        ddl-auto: none
      show-sql: false
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect